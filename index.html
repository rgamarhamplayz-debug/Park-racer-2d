<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Park Racer: Ascension</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Changa+One&display=swap');
        body { margin: 0; background: #050a05; font-family: 'Changa One', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; color: #fff; }
        
        /* FIX: Scaling Container for Iframe Compatibility */
        #scaler { display: flex; flex-direction: column; align-items: center; justify-content: center; transform-origin: center; }
        
        #game-container { position: relative; width: 360px; height: 520px; }
        canvas { background: #111; border: 3px solid #0ff; border-radius: 8px; width: 100%; height: 100%; display: block; box-shadow: 0 0 20px rgba(0,255,255,0.2); }
        
        #hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 18px; color: #0ff; pointer-events: none; z-index: 10; text-shadow: 2px 2px #000; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; border-radius: 8px; }
        
        .garage { background: #111; padding: 20px; border: 2px solid #0ff; width: 80%; border-radius: 12px; text-align: center; }
        .upgrade-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; font-size: 14px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        
        button { border: none; font-family: 'Changa One', sans-serif; cursor: pointer; text-transform: uppercase; border-radius: 20px; }
        .btn-main { padding: 15px; background: #0ff; color: #000; font-size: 20px; width: 100%; margin-top: 15px; box-shadow: 0 0 15px #0ff; }
        .btn-up { padding: 5px 12px; background: #ffd700; color: #000; font-size: 12px; }
        
        #ui-layer { width: 360px; display: flex; justify-content: space-between; margin-top: 15px; gap: 10px; height: 70px; }
        .control-btn { flex: 1; background: rgba(0,255,255,0.1); color: #0ff; border: 2px solid #0ff; border-radius: 12px; font-size: 30px; display: flex; justify-content: center; align-items: center; user-select: none; }
    </style>
</head>
<body>

    <div id="scaler">
        <div id="game-container">
            <div id="hud">
                <span>SCORE: <span id="scoreText">0</span></span>
                <span style="color:#ffd700">GOLD: <span id="coinText">0</span></span>
            </div>
            <div id="overlay">
                <div class="garage">
                    <h2 style="color:#0ff; margin:0 0 10px 0;">THE GARAGE</h2>
                    <div class="upgrade-row"><span>ENGINE</span><button class="btn-up" onclick="buy('speed')">Cost: <span id="c-speed">50</span></button></div>
                    <div class="upgrade-row"><span>STEER</span><button class="btn-up" onclick="buy('handling')">Cost: <span id="c-handling">50</span></button></div>
                    <div class="upgrade-row"><span>JUMP</span><button class="btn-up" onclick="buy('jump')">Cost: <span id="c-jump">50</span></button></div>
                    <button class="btn-main" onclick="start()">DRIVE</button>
                </div>
            </div>
            <canvas id="game"></canvas>
        </div>

        <div id="ui-layer">
            <div id="left-btn" class="control-btn">←</div>
            <div id="jump-btn" class="control-btn">🚀</div>
            <div id="right-btn" class="control-btn">→</div>
        </div>
    </div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = 360; canvas.height = 520;

// FIX: Auto-Resize for 800x450 iframe
function handleResize() {
    const scaler = document.getElementById('scaler');
    const scale = Math.min(window.innerWidth / 380, window.innerHeight / 620);
    scaler.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', handleResize);
handleResize();

let save = JSON.parse(localStorage.getItem('parkRacerV4')) || { coins: 0, up: { speed: 1, handling: 1, jump: 1 } };
const saveGame = () => { localStorage.setItem('parkRacerV4', JSON.stringify(save)); updateUI(); };

let score = 0, baseSpd = 0, lane = 2, px = 180, active = false, isJ = false, jT = 0;
let enemies = [], trees = [], coins = [];
const lanes = [35, 93, 151, 209, 267, 325];

function updateUI() {
    document.getElementById('coinText').innerText = save.coins;
    ['speed', 'handling', 'jump'].forEach(id => document.getElementById('c-'+id).innerText = save.up[id] * 50);
}

function buy(t) {
    let cost = save.up[t] * 50;
    if(save.coins >= cost) { save.coins -= cost; save.up[t]++; saveGame(); }
}

function start() {
    active = true; score = 0; enemies = []; trees = []; coins = []; lane = 2; px = 180;
    baseSpd = 3.8 + (save.up.speed * 0.3); // Balanced starting speed
    document.getElementById('overlay').style.display = 'none';
}

function die() {
    active = false;
    save.coins += Math.floor(score / 100); saveGame();
    document.getElementById('overlay').style.display = 'flex';
}

const input = (dir) => { if(active) lane = Math.max(0, Math.min(5, lane + dir)); };
const jump = () => { if(active && !isJ) { isJ = true; jT = 30 + (save.up.jump * 5); } };

// FIX: Desktop Playability (Keyboard Support)
window.addEventListener('keydown', (e) => {
    if(e.key === "ArrowLeft") input(-1);
    if(e.key === "ArrowRight") input(1);
    if(e.key === " " || e.key === "ArrowUp") jump();
});

// Mobile Touch Controls
const bind = (id, fn) => {
    const el = document.getElementById(id);
    el.onpointerdown = (e) => { e.preventDefault(); fn(); };
};
bind('left-btn', () => input(-1)); bind('right-btn', () => input(1)); bind('jump-btn', () => jump());

function drawCar(x, y, color, isP) {
    ctx.save(); ctx.translate(x, y);
    if(isJ && isP) { ctx.scale(1.2, 1.2); ctx.shadowBlur = 15; ctx.shadowColor = "#fff"; }
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.roundRect(-15, -25, 30, 50, 5); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(-12, -12, 24, 15);
    ctx.restore();
}

function update() {
    if(!active) return;
    score++; document.getElementById('scoreText').innerText = score;
    let currentSpeed = baseSpd + (score / 5000); // Gradual speed increase
    px += (lanes[lane] - px) * (0.15 + (save.up.handling * 0.05));
    if(isJ) { jT--; if(jT <= 0) isJ = false; }

    if(Math.random() < 0.025) enemies.push({l: Math.floor(Math.random()*6), y: -100, c: `hsl(${Math.random()*360}, 60%, 50%)`});
    if(Math.random() < 0.015) coins.push({l: Math.floor(Math.random()*6), y: -50});
    if(Math.random() < 0.04) trees.push({x: Math.random()<0.5?10:350, y:-50});

    enemies.forEach((e, i) => {
        e.y += currentSpeed;
        if(!isJ && Math.abs(px - lanes[e.l]) < 28 && Math.abs(440 - e.y) < 45) die();
        if(e.y > 600) enemies.splice(i, 1);
    });
    coins.forEach((c, i) => {
        c.y += currentSpeed;
        if(Math.abs(px - lanes[c.l]) < 30 && Math.abs(440 - c.y) < 40) { save.coins += 5; saveGame(); coins.splice(i, 1); }
        if(c.y > 600) coins.splice(i, 1);
    });
    trees.forEach((t, i) => { t.y += currentSpeed; if(t.y > 600) trees.splice(i, 1); });
}

function draw() {
    ctx.fillStyle = "#1a2a1a"; ctx.fillRect(0,0,360,520);
    ctx.fillStyle = "#222"; ctx.fillRect(20,0,320,520);
    ctx.setLineDash([15, 15]); ctx.strokeStyle = "rgba(255,255,255,0.1)";
    ctx.beginPath(); for(let i=1; i<6; i++) { ctx.moveTo(20+(320/6)*i, 0); ctx.lineTo(20+(320/6)*i, 520); } ctx.stroke();
    
    trees.forEach(t => { ctx.fillStyle = "#0a1a0a"; ctx.beginPath(); ctx.arc(t.x, t.y, 12, 0, Math.PI*2); ctx.fill(); });
    coins.forEach(c => { ctx.fillStyle = "#ffd700"; ctx.beginPath(); ctx.arc(lanes[c.l], c.y, 8, 0, Math.PI*2); ctx.fill(); });
    enemies.forEach(e => drawCar(lanes[e.l], e.y, e.c, false));
    drawCar(px, 440, "#0ff", true);
    update();
    requestAnimationFrame(draw);
}
updateUI(); draw();
</script>
</body>
</html>
